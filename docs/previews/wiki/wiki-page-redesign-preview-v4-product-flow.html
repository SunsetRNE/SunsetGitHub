<style>

12px}.badge{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:13px;font-weight:850;color:#4c5665}.dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(24,160,94,.14)}.hero h1{font-size:31px;line-height:1.06;letter-spacing:-.055em;margin:16px 0 8px}.hero p{font-size:16px;color:#626b79;line-height:1.48;margin:0}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:16px}.quick button{height:72px;border-radius:20px;background:#fff;border:1px solid #e8edf4;text-align:left;padding:11px;color:#161a21}.quick b{display:block;font-size:17px}.quick span{display:block;font-size:12px;color:var(--muted);margin-top:3px}.switch{position:sticky;top:0;z-index:8;margin:0 0 12px;padding:8px 0;background:linear-gradient(180deg,rgba(246,248,251,.98),rgba(246,248,251,.8));backdrop-filter:blur(14px)}.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:#edf1f6;border-radius:18px;padding:5px}.seg button{border-radius:13px;padding:10px 4px;background:transparent;color:#626c7a;font-size:13px;font-weight:900}.seg button.active{background:#fff;color:#111;box-shadow:0 5px 16px rgba(15,23,42,.08)}.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:16px;margin-bottom:14px;box-shadow:0 5px 16px rgba(17,24,39,.035)}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}.h2{font-size:20px;font-weight:950;letter-spacing:-.025em}.mini{font-size:13px;color:var(--muted);line-height:1.45}.pill{border-radius:999px;padding:6px 10px;font-size:12px;font-weight:950}.ok{background:#eaf8f1;color:#087943}.warn{background:#fff2d9;color:#9b5a00}.bad{background:#feeceb;color:#b4231f}.info{background:#edf4ff;color:#1d55ba}.purple{background:#f0edff;color:#5436cf}.search{height:48px;width:100%;border:1px solid var(--line);border-radius:17px;background:#f9fbfd;padding:0 14px;margin-bottom:8px}.page{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-top:1px solid var(--line2)}.page:first-of-type{border-top:0}.doc{width:44px;height:44px;border-radius:16px;background:#eef4ff;color:var(--blue);display:grid;place-items:center;font-weight:950}.pageMain{flex:1;min-width:0}.pageMain b{display:block;font-size:16px;margin-bottom:4px}.pageMain span{display:block;color:var(--muted);font-size:13px;line-height:1.38}.chev{font-size:24px;color:#a7afbc}.empty{padding:28px 12px;text-align:center;color:var(--muted)}.emptyIcon{width:64px;height:64px;margin:0 auto 12px;border-radius:25px;background:#f0f3f7;display:grid;place-items:center;font-size:29px}.empty b{display:block;color:#20242a;font-size:18px;margin-bottom:6px}.timeline{display:grid;gap:10px}.step{display:grid;grid-template-columns:24px 1fr;gap:10px}.step i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#a1aab8;color:#fff;font-style:normal;font-size:12px;font-weight:950}.step.done i{background:var(--green)}.step.active i{background:var(--amber)}.step.fail i{background:var(--red)}.step.edit i{background:var(--purple)}.step b{display:block;font-size:14px}.step span{display:block;color:var(--muted);font-size:13px;line-height:1.35}.bottomBar{position:absolute;left:12px;right:12px;bottom:12px;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(18px);border:1px solid rgba(225,230,238,.95);border-radius:26px;padding:10px;box-shadow:0 18px 46px rgba(15,23,42,.18);display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.bottomBar button{border-radius:18px;padding:13px 8px;font-size:13px;font-weight:950;background:#f0f3f7;color:#111}.bottomBar .primary{background:#111;color:#fff}.bottomBar .edit{background:var(--purple);color:#fff}.editor{position:absolute;inset:36px 0 0;background:var(--bg);z-index:50;transform:translateX(105%);transition:.28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}.editor.show{transform:translateX(0)}.editTop{height:72px;display:flex;align-items:center;gap:12px;padding:0 16px;background:rgba(255,255,255,.92);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.editTop .commit{background:var(--purple);color:#fff;border-radius:16px;padding:12px 14px;font-weight:950}.editBody{flex:1;overflow:auto;padding:14px 16px 122px}.field{margin-bottom:12px}.field label{display:flex;justify-content:space-between;color:#66717f;font-size:13px;font-weight:850;margin-bottom:7px}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:18px;background:#fff;padding:13px 14px;outline:none}.field textarea{min-height:330px;line-height:1.55;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;resize:vertical}.field input:focus,.field textarea:focus{border-color:#9d8cff;box-shadow:0 0 0 4px rgba(113,87,255,.12)}.editTools{display:flex;gap:8px;overflow:auto;margin-bottom:12px}.editTools button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px 12px;font-weight:950}.mode{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#f0edff;border-radius:18px;padding:5px;margin-bottom:12px}.mode button{border-radius:13px;background:transparent;color:#675c9e;padding:10px;font-weight:950}.mode button.active{background:#fff;color:#5134cc;box-shadow:0 5px 16px rgba(81,52,204,.11)}.preview{display:none;background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px;line-height:1.55}.preview h1{font-size:24px;margin:0 0 10px}.preview h2{font-size:19px;margin:16px 0 8px}.preview p{color:#3e4652}.warning{border:1px solid #ffd0cc;background:#fff5f3;color:#a52b25;border-radius:18px;padding:12px;font-size:13px;line-height:1.45;margin-bottom:12px}.editBottom{position:absolute;left:12px;right:12px;bottom:12px;background:rgba(255,255,255,.92);backdrop-filter:blur(18px);border:1px solid rgba(225,230,238,.95);border-radius:26px;padding:10px;box-shadow:0 18px 46px rgba(15,23,42,.18);display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.editBottom button{border-radius:18px;padding:13px 8px;font-size:13px;font-weight:950;background:#f0f3f7}.editBottom .save{background:#111;color:#fff}.editBottom .commit2{background:var(--purple);color:#fff}.sheet{position:absolute;inset:0;background:rgba(15,23,42,.26);z-index:70;display:grid;place-items:end center;opacity:0;pointer-events:none;transition:.2s}.sheet.show{opacity:1;pointer-events:auto}.panel{width:100%;background:#fff;border-radius:28px 28px 0 0;padding:18px;box-shadow:0 -24px 70px rgba(0,0,0,.22);transform:translateY(26px);transition:.2s}.sheet.show .panel{transform:translateY(0)}.grab{width:46px;height:5px;border-radius:99px;background:#d1d7df;margin:0 auto 14px}.panel h3{font-size:24px;margin:0 0 8px}.diag{background:#0d1117;color:#c9d1d9;border-radius:18px;padding:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;line-height:1.55;white-space:pre-wrap;max-height:190px;overflow:auto}.panelActions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.panelActions button{border-radius:17px;padding:14px 12px;font-weight:950;background:#eef2f7}.panelActions .dark{background:#111;color:#fff}.toast{position:absolute;left:50%;bottom:24px;z-index:90;transform:translateX(-50%) translateY(18px);opacity:0;background:#111;color:#fff;border-radius:999px;padding:12px 16px;font-weight:900;box-shadow:0 14px 38px rgba(0,0,0,.25);transition:.22s;white-space:nowrap}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.skeleton{height:16px;border-radius:999px;background:linear-gradient(90deg,#e5eaf0,#f8fafc,#e5eaf0);background-size:220% 100%;animation:shim 1.1s infinite;margin:12px 0}@keyframes shim{to{background-position:-220% 0}}@media(max-width:380px){.quick{grid-template-columns:1fr}.bottomBar,.editBottom{grid-template-columns:1fr}.phone{height:900px}}

<body>
<div class="stage"><main class="phone"><div class="status"><span>10:53</span><span>◥ 5G 100%</span></div><section class="shell"><header class="top"><button class="icon back" onclick="toast('返回仓库详情')">‹</button><div class="title"><b>Wiki</b><span>Sunset / SunsetGitHub</span></div><button class="icon" onclick="openSheet('diag')">⌁</button></header><div class="body"><section class="hero"><div class="heroLine"><span class="badge"><span class="dot" id="dot"></span><span id="badge">已同步</span></span><span class="pill ok" id="statePill">READY</span></div><h1 id="heroTitle">项目知识库</h1><p id="summary">浏览 Wiki 页面，必要时进入全屏编辑器修改 Markdown，并通过草稿与提交校验保护内容。</p><div class="quick"><button onclick="setTab('pages')"><b id="qPages">4</b><span>Wiki 页面</span></button><button onclick="setTab('state')"><b id="qState">良好</b><span>同步状态</span></button><button onclick="openEditor()"><b>编辑</b><span>Home.md</span></button></div></section><div class="switch"><div class="seg"><button class="active" data-tab="pages">页面</button><button data-tab="state">状态</button><button data-tab="empty">空态</button><button data-tab="error">错误</button></div></div><section id="view"></section></div><nav class="bottomBar"><button onclick="openSheet('github')">GitHub 打开</button><button onclick="refresh()">刷新</button><button class="edit" onclick="openEditor()">编辑 Home</button></nav><aside class="editor" id="editorView"><header class="editTop"><button class="icon back" onclick="closeEditor()">‹</button><div class="title"><b>编辑 Home.md</b><span id="dirtyText">有未保存更改</span></div><button class="commit" onclick="commitEdit()">提交</button></header><div class="editBody"><div class="warning" id="conflict">远端版本检查通过。提交前会再次校验 SHA，避免覆盖他人更改。</div><div class="field"><label><span>页面标题</span><span id="titleCount">4 字</span></label><input id="editTitle" value="Home" oninput="dirty()"></div><div class="editTools"><button onclick="insertMd('**加粗**')">B</button><button onclick="insertMd('## 小标题')">H2</button><button onclick="insertMd('- 待办事项')">列表</button><button onclick="insertMd('[链接](https://github.com)')">链接</button><button onclick="insertMd('`code`')">Code</button></div><div class="mode"><button class="active" id="modeEdit" onclick="setMode('edit')">编辑</button><button id="modePreview" onclick="setMode('preview')">预览</button></div><div class="field" id="editPane"><label><span>Markdown 内容</span><span id="wordCount">0 字</span></label><textarea id="editor" oninput="dirty()"># Home

欢迎来到 SunsetGitHub Wiki。

## 快速入口
- 安装与构建
- GitHub API 策略
- 发布检查清单

这里是更接近真实 App 的全屏编辑态：顶部提交、底部草稿/冲突/预览动作，阅读页不再被编辑控件污染。</textarea></div><div class="preview" id="previewPane"></div><div class="field"><label><span>提交信息</span><span>必填</span></label><input id="commitMsg" value="Update wiki Home page" oninput="dirty()"></div></div><div class="editBottom"><button onclick="saveDraft()">保存草稿</button><button onclick="simulateConflict()">模拟冲突</button><button class="commit2" onclick="commitEdit()">提交更改</button></div></aside><div class="sheet" id="sheet" onclick="closeSheet(event)"><div class="panel"><div class="grab"></div><div id="sheetBody"></div></div></div><div class="toast" id="toast"></div></section></main></div>
<script>
const pages=[['Home','Home.md','Wiki 首页、项目导航和维护说明。','2 小时前 · 1.8 KB'],['安装与构建','Build.md','Android SDK、Gradle Wrapper、签名配置。','昨天 · 4.2 KB'],['GitHub API 策略','Api-Policy.md','REST、分页、限流和 wiki.git 回退策略。','3 天前 · 6.7 KB'],['发布检查清单','Release.md','版本号、签名、APK 输出和上传前检查。','1 周前 · 3.1 KB']];
let tab='pages', mode='edit', hasDirty=true;
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
function setTab(t){tab=t;document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));if(t==='pages')readyHeader();if(t==='state')partialHeader();if(t==='empty')emptyHeader();if(t==='error')errorHeader();render()}
function readyHeader(){dot.style.background='#18a05e';dot.style.boxShadow='0 0 0 4px rgba(24,160,94,.14)';badge.textContent='已同步';statePill.textContent='READY';statePill.className='pill ok';heroTitle.textContent='项目知识库';summary.textContent='浏览 Wiki 页面，必要时进入全屏编辑器修改 Markdown，并通过草稿与提交校验保护内容。';qPages.textContent='4';qState.textContent='良好'}
function partialHeader(){dot.style.background='#df8b00';dot.style.boxShadow='0 0 0 4px rgba(223,139,0,.15)';badge.textContent='部分可用';statePill.textContent='PARTIAL';statePill.className='pill warn';heroTitle.textContent='Wiki 已启用，索引待补全';summary.textContent='REST 可确认 Wiki 已启用；页面索引可以通过刷新或连接 wiki.git 后补全。';qPages.textContent='0';qState.textContent='部分'}
function emptyHeader(){dot.style.background='#df8b00';dot.style.boxShadow='0 0 0 4px rgba(223,139,0,.15)';badge.textContent='暂无页面';statePill.textContent='EMPTY';statePill.className='pill warn';heroTitle.textContent='Wiki 已开启但为空';summary.textContent='这里不是错误态，应引导用户创建 Home 页面或前往 GitHub Wiki 初始化。';qPages.textContent='0';qState.textContent='空'}
function errorHeader(){dot.style.background='#d93c35';dot.style.boxShadow='0 0 0 4px rgba(217,60,53,.14)';badge.textContent='获取失败';statePill.textContent='ERROR';statePill.className='pill bad';heroTitle.textContent='无法读取 Wiki 状态';summary.textContent='网络、权限或 GitHub API 异常时，保留重试、诊断和外部打开入口。';qPages.textContent='—';qState.textContent='异常'}
function render(){if(tab==='pages'){view.innerHTML=`<article class='card'><div class='head'><div><div class='h2'>页面列表</div><div class='mini'>点击页面可预览，也可以进入全屏编辑。</div></div><span class='pill info'>4 个</span></div><input class='search' placeholder='搜索 Wiki 页面' oninput='filterPages(this.value)'><div id='pageList'>${pageHtml(pages)}</div></article>`}else if(tab==='state'){view.innerHTML=`<article class='card'><div class='head'><div><div class='h2'>同步状态</div><div class='mini'>状态信息不再占据主界面，只在需要时解释。</div></div><span class='pill warn'>PARTIAL</span></div><div class='timeline'><div class='step done'><i>✓</i><div><b>REST 仓库状态</b><span>已确认 has_wiki = true</span></div></div><div class='step active'><i>•</i><div><b>页面索引探测</b><span>unexpected end of stream，可重试</span></div></div><div class='step'><i>•</i><div><b>wiki.git 补全</b><span>用户触发或后台同步后可展示完整页面</span></div></div></div></article>`}else if(tab==='empty'){view.innerHTML=`<article class='card'><div class='empty'><div class='emptyIcon'>📄</div><b>还没有 Wiki 页面</b><span>创建 Home 页面后，这里会展示页面列表、最近更新和编辑入口。</span></div><div class='panelActions'><button class='dark' onclick='openEditor()'>创建 Home</button><button onclick='openSheet("github")'>在 GitHub 初始化</button></div></article>`}else{view.innerHTML=`<article class='card'><div class='empty'><div class='emptyIcon'>⚠</div><b>读取失败</b><span>请检查网络、登录状态或仓库权限。你仍然可以复制诊断信息。</span></div><div class='panelActions'><button class='dark' onclick='refresh()'>重试</button><button onclick='openSheet("diag")'>诊断</button></div></article>`}}
function pageHtml(list){return list.map((p,i)=>`<div class='page' onclick='openPage(${i})'><div class='doc'>W</div><div class='pageMain'><b>${p[0]}</b><span>${p[1]} · ${p[3]}<br>${p[2]}</span></div><div class='chev'>›</div></div>`).join('')}
function filterPages(q){q=q.toLowerCase();document.getElementById('pageList').innerHTML=pageHtml(pages.filter(p=>p.join(' ').toLowerCase().includes(q)))}
function openPage(i){const p=pages[i];sheetBody.innerHTML=`<h3>${p[0]}</h3><p class='mini'>${p[1]} · ${p[3]}</p><p>${p[2]}</p><div class='panelActions'><button class='dark' onclick='hideSheet();openEditor()'>编辑此页</button><button onclick='hideSheet()'>关闭</button></div>`;sheet.classList.add('show')}
function openEditor(){editorView.classList.add('show');updateCounts();setMode('edit');toast('进入全屏编辑态')}
function closeEditor(){if(hasDirty){openSheet('leave');return}editorView.classList.remove('show')}
function setMode(m){mode=m;modeEdit.classList.toggle('active',m==='edit');modePreview.classList.toggle('active',m==='preview');editPane.style.display=m==='edit'?'block':'none';previewPane.style.display=m==='preview'?'block':'none';if(m==='preview')renderPreview()}
function renderPreview(){let html=editor.value.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/^# (.*)$/gm,'<h1>$1</h1>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/^- (.*)$/gm,'<li>$1</li>').replace(/(<li>.*<\/li>)/gs,'<ul>$1</ul>').replace(/\n\n/g,'</p><p>').replace(/^(?!<h|<ul|<p)(.+)$/gm,'<p>$1</p>');previewPane.innerHTML=html}
function insertMd(s){const e=editor,a=e.selectionStart,b=e.selectionEnd;e.value=e.value.slice(0,a)+s+e.value.slice(b);e.focus();e.selectionStart=e.selectionEnd=a+s.length;dirty();toast('已插入 Markdown')}
function dirty(){hasDirty=true;dirtyText.textContent='有未保存更改';updateCounts();if(mode==='preview')renderPreview()}
function updateCounts(){titleCount.textContent=editTitle.value.length+' 字';wordCount.textContent=editor.value.replace(/\s/g,'').length+' 字'}
function saveDraft(){hasDirty=false;dirtyText.textContent='草稿已保存';toast('草稿已保存到本地')}
function commitEdit(){if(!commitMsg.value.trim()){toast('请填写提交信息');return}toast('正在提交更改');setTimeout(()=>{hasDirty=false;dirtyText.textContent='已提交';conflict.textContent='提交成功。已刷新远端 SHA 与本地缓存。';conflict.style.background='#edfdf4';conflict.style.borderColor='#bdf3cf';conflict.style.color='#087941';toast('Wiki 已提交')},850)}
function simulateConflict(){hasDirty=true;dirtyText.textContent='存在远端冲突';conflict.textContent='检测到远端 Home.md 已更新。请查看差异后选择覆盖远端或重新载入。';conflict.style.background='#fff5f3';conflict.style.borderColor='#ffd0cc';conflict.style.color='#a52b25';toast('已模拟冲突')}
function refresh(){setTab('state');view.innerHTML=`<article class='card'><div class='head'><div><div class='h2'>正在刷新</div><div class='mini'>重新检查 REST 状态和页面索引。</div></div><span class='pill info'>LOADING</span></div><div class='skeleton' style='width:92%'></div><div class='skeleton' style='width:74%'></div><div class='skeleton' style='width:84%'></div></article>`;toast('正在刷新');setTimeout(()=>{setTab('pages');toast('已同步页面')},900)}
function openSheet(type){if(type==='diag')sheetBody.innerHTML=`<h3>诊断信息</h3><div class='diag'>state=${tab}\nhasWiki=true\nindex=${tab==='pages'?'ready':'partial'}\neditorDirty=${hasDirty}\nstrategy=read view + full screen editor + sha check</div><div class='panelActions'><button class='dark' onclick='toast("诊断已复制")'>复制</button><button onclick='hideSheet()'>关闭</button></div>`;else if(type==='github')sheetBody.innerHTML=`<h3>外部打开</h3><p>准备打开 GitHub Wiki。适合未启用、权限不足或网络异常时作为兜底入口。</p><div class='panelActions'><button class='dark' onclick='toast("打开 GitHub Wiki")'>打开</button><button onclick='hideSheet()'>取消</button></div>`;else sheetBody.innerHTML=`<h3>有未保存更改</h3><p>离开编辑器前，建议先保存草稿或提交更改。</p><div class='panelActions'><button class='dark' onclick='saveDraft();editorView.classList.remove("show");hideSheet()'>保存并离开</button><button onclick='hasDirty=false;editorView.classList.remove("show");hideSheet()'>放弃</button></div>`;sheet.classList.add('show')}
function closeSheet(e){if(e.target.id==='sheet')hideSheet()}function hideSheet(){sheet.classList.remove('show')}function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__t);window.__t=setTimeout(()=>t.classList.remove('show'),1500)}
render();
</script>
</body>
</html>
