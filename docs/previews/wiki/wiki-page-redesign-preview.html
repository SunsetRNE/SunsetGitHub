<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Wiki 页面重绘方案预览</title>
<style>
:root{--bg:#f6f8fa;--card:#fff;--text:#20242a;--muted:#6b7280;--line:#d9dee5;--brand:#111827;--blue:#2563eb;--green:#16a34a;--amber:#d97706;--red:#dc2626;--soft-blue:#eff6ff;--soft-green:#ecfdf5;--soft-amber:#fffbeb;--soft-red:#fef2f2;--shadow:0 12px 30px rgba(15,23,42,.08);--radius:22px}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eef2f7,#f8fafc);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans SC",Arial,sans-serif;color:var(--text)}.stage{min-height:100vh;display:grid;place-items:start center;padding:22px 12px 40px}.phone{width:min(420px,100%);min-height:860px;background:var(--bg);border:1px solid #e5e7eb;border-radius:34px;overflow:hidden;box-shadow:0 24px 80px rgba(15,23,42,.16)}.statusbar{height:34px;padding:8px 18px 0;display:flex;justify-content:space-between;font-weight:800;color:#111}.appbar{height:78px;display:flex;align-items:center;gap:18px;padding:0 22px;background:rgba(246,248,250,.9);position:sticky;top:0;z-index:5;backdrop-filter:blur(16px);border-bottom:1px solid rgba(226,232,240,.8)}.back{border:0;background:transparent;font-size:34px;line-height:1;color:#6b7280}.title{font-size:30px;font-weight:850;letter-spacing:-.04em}.content{padding:16px 18px 26px}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 2px 0 rgba(15,23,42,.02);padding:18px;margin:0 0 16px}.hero{padding:20px}.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:14px;color:var(--muted);background:#fff}.dot{width:8px;height:8px;border-radius:999px;background:var(--green)}.hero h1{margin:18px 0 8px;font-size:32px;letter-spacing:-.04em}.hero p{margin:0;color:#65707d;font-size:18px;line-height:1.45}.section-title{font-size:20px;font-weight:750;margin:0 0 14px}.kv{display:grid;grid-template-columns:1fr auto;gap:14px 18px;font-size:17px}.kv .k{color:#727b88}.kv .v{text-align:right;font-weight:650;max-width:210px}.toolbar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}.seg{border:1px solid var(--line);background:#fff;color:#374151;border-radius:999px;padding:10px 8px;font-size:13px;font-weight:700}.seg.active{background:#111827;color:#fff;border-color:#111827}.actions{display:grid;gap:10px}.btn{border:0;border-radius:14px;padding:14px 16px;font-size:16px;font-weight:800;background:#111827;color:#fff;box-shadow:0 10px 20px rgba(17,24,39,.15)}.btn.secondary{background:#eef2f7;color:#111827;box-shadow:none}.btn.ghost{background:#fff;border:1px solid var(--line);color:#111827;box-shadow:none}.pages-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.count{font-size:14px;color:var(--muted);background:#f3f4f6;border-radius:999px;padding:5px 9px}.search{width:100%;border:1px solid var(--line);border-radius:15px;padding:13px 14px;font-size:16px;background:#f9fafb;margin-bottom:12px}.page{display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-top:1px solid #edf0f3}.page:first-of-type{border-top:0}.icon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--soft-blue);color:var(--blue);font-weight:900}.page h3{margin:0 0 4px;font-size:17px}.page p{margin:0;color:var(--muted);font-size:14px;line-height:1.35}.chev{margin-left:auto;color:#9ca3af;font-size:24px}.hint{border-radius:18px;padding:14px 15px;line-height:1.55;font-size:16px;color:#4b5563}.hint.ok{background:var(--soft-green);border:1px solid #bbf7d0}.hint.warn{background:var(--soft-amber);border:1px solid #fde68a}.hint.err{background:var(--soft-red);border:1px solid #fecaca}.list{margin:0;padding-left:18px}.skeleton{height:18px;border-radius:999px;background:linear-gradient(90deg,#e5e7eb,#f8fafc,#e5e7eb);background-size:220% 100%;animation:shimmer 1.2s infinite;margin:12px 0}@keyframes shimmer{to{background-position:-220% 0}}.empty{text-align:center;padding:22px 10px;color:#6b7280}.empty b{display:block;color:#111827;font-size:20px;margin:8px}.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#111827;color:#fff;border-radius:999px;padding:12px 16px;opacity:0;pointer-events:none;transition:.22s;box-shadow:var(--shadow);z-index:20}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.sheet{position:fixed;inset:auto 0 0;display:grid;place-items:end center;background:rgba(15,23,42,.18);opacity:0;pointer-events:none;transition:.2s;z-index:15}.sheet.show{opacity:1;pointer-events:auto}.sheet-panel{width:min(420px,100%);background:#fff;border-radius:26px 26px 0 0;padding:18px;box-shadow:0 -18px 50px rgba(15,23,42,.2);transform:translateY(30px);transition:.2s}.sheet.show .sheet-panel{transform:translateY(0)}.mini{font-size:14px;color:var(--muted)}.hidden{display:none!important}.footer-note{text-align:center;color:#94a3b8;font-size:12px;margin-top:14px}
</style>
</head>
<body>
<div class="stage"><main class="phone" aria-label="Wiki 页面方案预览"><div class="statusbar"><span>10:53</span><span>◥ 5G 100%</span></div><header class="appbar"><button class="back" onclick="toast('返回上一级')">‹</button><div class="title">Wiki</div></header><section class="content"><div class="toolbar" aria-label="状态切换"><button class="seg active" data-state="partial">部分</button><button class="seg" data-state="ready">完整</button><button class="seg" data-state="loading">加载</button><button class="seg" data-state="empty">空页</button><button class="seg" data-state="disabled">未启用</button><button class="seg" data-state="error">错误</button></div><article class="card hero"><span class="pill" id="badge"><span class="dot" id="dot"></span><span id="badgeText">仅获取到部分状态</span></span><h1>Wiki</h1><p id="summary">Wiki 已启用，但页面索引未能完整解析。</p></article><article class="card"><h2 class="section-title">概览</h2><div class="kv"><div class="k">数据来源</div><div class="v" id="source">REST + GitHub Wiki 页面索引</div><div class="k">Wiki</div><div class="v" id="enabled">开启</div><div class="k">默认分支</div><div class="v" id="branch">main</div><div class="k">可见性</div><div class="v" id="visibility">public</div></div></article><article class="card" id="pagesCard"><div class="pages-head"><h2 class="section-title" style="margin:0">页面</h2><span class="count" id="count">0 个页面</span></div><input class="search" id="search" placeholder="搜索 Wiki 页面" oninput="renderPages()" /><div id="pages"></div></article><article class="card"><h2 class="section-title">提示</h2><div class="hint warn" id="hint"></div></article><article class="card"><h2 class="section-title">可执行操作</h2><p class="mini">查看、刷新、连接或管理该仓库的 Wiki 页面。</p><div class="actions"><button class="btn" onclick="toast('准备打开 GitHub Wiki')">在 GitHub 打开</button><button class="btn secondary" onclick="refreshIndex()">刷新页面索引</button><button class="btn ghost" onclick="toast('已复制诊断信息')">复制诊断信息</button></div></article><div class="footer-note">Standalone HTML preview · Wiki redesign states</div></section></main></div><div class="toast" id="toast"></div><div class="sheet" id="sheet" onclick="closeSheet(event)"><div class="sheet-panel"><h2 id="sheetTitle">页面标题</h2><p class="mini" id="sheetMeta">最后更新信息</p><p id="sheetText">页面摘要</p><div class="actions"><button class="btn" onclick="toast('打开页面详情')">查看页面内容</button><button class="btn ghost" onclick="hideSheet()">关闭</button></div></div></div>
<script>
const samplePages=[{title:'Home',meta:'更新于 2 小时前 · 1.8 KB',text:'仓库 Wiki 首页，通常放置项目介绍、导航和维护说明。'},{title:'安装指南',meta:'更新于 昨天 · 4.2 KB',text:'包含本地环境、Gradle 构建和常见配置步骤。'},{title:'API 说明',meta:'更新于 3 天前 · 6.7 KB',text:'记录 GitHub API 调用、鉴权、分页与错误处理策略。'},{title:'发布流程',meta:'更新于 1 周前 · 3.1 KB',text:'描述版本号、签名、打包和发布检查清单。'}];
const states={partial:{badge:'仅获取到部分状态',summary:'Wiki 已启用，但页面索引未能完整解析。',dot:'#d97706',source:'REST + GitHub Wiki 页面索引',enabled:'开启',branch:'main',visibility:'public',hint:'<ul class="list"><li>Wiki 已启用。</li><li>页面索引探测：unexpected end of stream on okhttp.Address。</li><li>REST 状态可稳定区分 Wiki 是否启用。</li><li>建议后续继续接入 wiki.git 源以读取完整页面内容。</li></ul>',kind:'warn',pages:[]},ready:{badge:'已同步',summary:'Wiki 状态和页面索引均已获取，可直接浏览页面。',dot:'#16a34a',source:'REST + wiki.git + 页面缓存',enabled:'开启',branch:'main',visibility:'public',hint:'<ul class="list"><li>Wiki 已启用，页面索引可用。</li><li>支持搜索、打开页面、刷新索引和复制诊断信息。</li><li>页面内容建议使用缓存优先，失败后回退远端。</li></ul>',kind:'ok',pages:samplePages},loading:{badge:'正在加载',summary:'正在检查 Wiki 状态并拉取页面索引。',dot:'#2563eb',source:'检测中',enabled:'检测中',branch:'—',visibility:'—',hint:'<ul class="list"><li>展示骨架屏，避免用户误判为空。</li><li>保留操作区，但禁用高风险提交操作。</li></ul>',kind:'warn',loading:true,pages:[]},empty:{badge:'暂无页面',summary:'Wiki 已启用，但当前没有可展示的页面。',dot:'#d97706',source:'REST + GitHub Wiki 页面索引',enabled:'开启',branch:'main',visibility:'private',hint:'<ul class="list"><li>Wiki 已启用。</li><li>页面样本数为 0，建议引导用户创建首页。</li></ul>',kind:'warn',pages:[]},disabled:{badge:'未启用',summary:'该仓库尚未开启 Wiki。',dot:'#6b7280',source:'REST 仓库状态',enabled:'关闭',branch:'main',visibility:'public',hint:'<ul class="list"><li>Wiki 未启用。</li><li>如果有管理权限，可前往 GitHub 仓库设置开启 Wiki。</li></ul>',kind:'warn',disabled:true,pages:[]},error:{badge:'获取失败',summary:'Wiki 状态检查失败，请重试或检查网络与权限。',dot:'#dc2626',source:'请求失败',enabled:'未知',branch:'—',visibility:'—',hint:'<ul class="list"><li>网络连接中断或 GitHub API 返回异常。</li><li>保留重试、复制诊断和在 GitHub 打开的兜底操作。</li></ul>',kind:'err',pages:[]}};
let current='partial';
function setState(name){current=name;document.querySelectorAll('.seg').forEach(b=>b.classList.toggle('active',b.dataset.state===name));const s=states[name];badgeText.textContent=s.badge;summary.textContent=s.summary;dot.style.background=s.dot;source.textContent=s.source;enabled.textContent=s.enabled;branch.textContent=s.branch;visibility.textContent=s.visibility;hint.className='hint '+s.kind;hint.innerHTML=s.hint;search.value='';renderPages();}
function renderPages(){const s=states[current];const q=search.value.trim().toLowerCase();pages.innerHTML='';if(s.loading){count.textContent='加载中';pages.innerHTML='<div class="skeleton" style="width:90%"></div><div class="skeleton" style="width:72%"></div><div class="skeleton" style="width:84%"></div>';return}const list=(s.pages||[]).filter(p=>p.title.toLowerCase().includes(q));count.textContent=list.length+' 个页面';if(!list.length){pages.innerHTML='<div class="empty"><b>'+(s.disabled?'Wiki 未启用':'暂无页面')+'</b><span>'+(current==='partial'?'页面索引暂不可用，可先显示状态和操作入口。':'没有匹配的 Wiki 页面。')+'</span></div>';return}for(const p of list){const el=document.createElement('div');el.className='page';el.innerHTML='<div class="icon">W</div><div><h3>'+p.title+'</h3><p>'+p.meta+'</p><p>'+p.text+'</p></div><div class="chev">›</div>';el.onclick=()=>openSheet(p);pages.appendChild(el)}}
function refreshIndex(){toast('正在刷新页面索引');setState('loading');setTimeout(()=>{setState('ready');toast('页面索引已刷新')},900)}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove('show'),1600)}
function openSheet(p){sheetTitle.textContent=p.title;sheetMeta.textContent=p.meta;sheetText.textContent=p.text;sheet.classList.add('show')}function hideSheet(){sheet.classList.remove('show')}function closeSheet(e){if(e.target.id==='sheet')hideSheet()}
document.querySelectorAll('.seg').forEach(b=>b.onclick=()=>setState(b.dataset.state));setState('partial');
</script>
</body>
</html>
