ound:var(--red)}.step.edit i{background:var(--purple)}.step b{display:block;font-size:14px}.step span{display:block;margin-top:2px;font-size:12px;color:var(--muted);line-height:1.36}.actions{position:absolute;left:10px;right:10px;bottom:10px;z-index:25;background:rgba(255,255,255,.94);backdrop-filter:blur(18px);border:1px solid var(--border);border-radius:22px;padding:8px;display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:7px;box-shadow:0 18px 48px rgba(27,31,36,.15)}.actions button{border-radius:15px;padding:12px 7px;font-size:13px;font-weight:850;background:#f6f8fa;color:#24292f}.actions .primary{background:#24292f;color:#fff}.actions .edit{background:var(--blue);color:#fff}.editor{position:absolute;inset:36px 0 0;background:#fff;z-index:50;display:flex;flex-direction:column;transform:translateX(105%);transition:.26s cubic-bezier(.2,.75,.2,1)}.editor.show{transform:translateX(0)}.editTop{height:68px;border-bottom:1px solid var(--border2);display:flex;align-items:center;gap:12px;padding:0 14px;background:rgba(255,255,255,.95);backdrop-filter:blur(18px)}.editTop .commit{background:var(--green);color:#fff;border-radius:14px;padding:11px 13px;font-size:13px;font-weight:900}.editTitle{flex:1;min-width:0}.editTitle b{display:block;font-size:16px}.editTitle span{display:block;font-size:12px;color:var(--muted);margin-top:2px}.editBody{flex:1;overflow:auto;background:var(--canvas);padding:12px 14px 120px}.notice{border:1px solid var(--border);background:#fff;border-radius:16px;padding:11px 12px;color:#57606a;font-size:13px;line-height:1.4;margin-bottom:12px}.notice.warn{background:var(--yellow2);border-color:#f0d98c;color:#6f4e00}.notice.bad{background:var(--red2);border-color:#ffb4ad;color:#a40e26}.notice.ok{background:var(--green2);border-color:#aceebb;color:#116329}.field{margin-bottom:12px}.field label{display:flex;justify-content:space-between;font-size:12px;font-weight:850;color:var(--muted);margin-bottom:6px}.field input,.field textarea{width:100%;border:1px solid var(--border);border-radius:14px;background:#fff;padding:12px;outline:none;color:var(--ink)}.field textarea{min-height:330px;line-height:1.55;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;resize:vertical}.field input:focus,.field textarea:focus{border-color:#54aeff;box-shadow:0 0 0 3px rgba(84,174,255,.22)}.mdTools{display:flex;gap:7px;overflow:auto;margin:0 0 12px}.mdTools button{flex:0 0 auto;border:1px solid var(--border);background:#fff;border-radius:12px;padding:9px 11px;font-weight:850;color:#24292f}.mode{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#eaeef2;border-radius:14px;padding:4px;margin-bottom:12px}.mode button{border-radius:10px;background:transparent;color:var(--muted);font-weight:850;padding:9px}.mode button.active{background:#fff;color:#24292f;box-shadow:0 2px 8px rgba(27,31,36,.08)}.preview{display:none;background:#fff;border:1px solid var(--border);border-radius:16px;padding:14px}.preview h1{font-size:23px;margin:0 0 10px}.preview h2{font-size:18px;margin:16px 0 8px;border-bottom:1px solid var(--border2);padding-bottom:7px}.preview p,.preview li{font-size:15px;line-height:1.52;color:#3b434b}.editActions{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(255,255,255,.95);backdrop-filter:blur(18px);border:1px solid var(--border);border-radius:22px;padding:8px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;box-shadow:0 18px 48px rgba(27,31,36,.15)}.editActions button{border-radius:15px;padding:12px 7px;font-size:13px;font-weight:850;background:#f6f8fa;color:#24292f}.editActions .save{background:#24292f;color:#fff}.editActions .commit2{background:var(--green);color:#fff}.drawer{position:absolute;inset:0;z-index:70;background:rgba(36,41,47,.25);display:grid;place-items:end center;opacity:0;pointer-events:none;transition:.2s}.drawer.show{opacity:1;pointer-events:auto}.sheet{width:100%;background:#fff;border-radius:24px 24px 0 0;padding:16px;box-shadow:0 -22px 70px rgba(27,31,3 <div class="stage"><main class="phone"><div class="status"><span>10:53</span><span>◥ 5G 100%</span></div><section class="app"><header class="top"><button class="navBtn back" onclick="toast('返回仓库详情')">‹</button><div class="repoTitle"><b>SunsetGitHub</b><span>Repository · Wiki</span></div><button class="iconBtn" onclick="openDrawer('diag')">⌘</button></header><div class="content"><section class="repoHeader"><div class="repoLine"><div class="repoName"><div class="owner">Sunset / REN / GitHub</div><h1>Wiki</h1><p class="repoDesc" id="desc">项目知识库、操作手册与发布说明。阅读页保持干净，编辑页全屏承载复杂动作。</p></div><span class="stateBadge ok" id="badge"><i class="dot"></i>已同步</span></div><div class="quickStats"><button class="stat" onclick="setView('read')"><b id="statPages">4</b><span>页面</span></button><button class="stat" onclick="setView('status')"><b id="statHealth">良好</b><span>状态</span></button><button class="stat" onclick="openEditor()"><b>编辑</b><span>Home.md</span></button></div></section><div class="tabsWrap"><div class="tabs"><button class="tab active" data-view="read">阅读</button><button class="tab" data-view="pages">目录</button><button class="tab" data-view="status">状态</button><button class="tab" data-view="empty">空态</button><button class="tab" data-view="error">错误</button></div></div><section id="view"></section></div><nav class="actions"><button onclick="openDrawer('github')">GitHub</button><button onclick="refresh()">刷新</button><button class="edit" onclick="openEditor()">编辑页面</button></nav><aside class="editor" id="editorView"><header class="editTop"><button class="navBtn back" onclick="tryCloseEditor()">‹</button><div class="editTitle"><b>编辑 Home.md</b><span id="dirtyText">有未保存更改</span></div><button class="commit" onclick="commitEdit()">提交</button></header><div class="editBody"><div class="notice" id="notice">正在编辑本地草稿。提交前会校验远端 SHA，避免覆盖他人更新。</div><div class="field"><label><span>页面标题</span><span id="titleCount">4 字</span></label><input id="editTitle" value="Home" oninput="markDirty()"></div><div class="mdTools"><button onclick="insertMd('**加粗**')">B</button><button onclick="insertMd('## 小标题')">H2</button><button onclick="insertMd('- 待办事项')">列表</button><button onclick="insertMd('[链接](https://github.com)')">链接</button><button onclick="insertMd('`code`')">Code</button></div><div class="mode"><button class="active" id="modeEdit" onclick="setMode('edit')">编辑</button><button id="modePreview" onclick="setMode('preview')">预览</button></div><div class="field" id="editPane"><label><span>Markdown 内容</span><span id="wordCount">0 字</span></label><textarea id="editor" oninput="markDirty()"># Home

欢迎来到 SunsetGitHub Wiki。

## 快速入口
- 安装与构建
- GitHub API 策略
- 发布检查清单

这一版改成 GitHub Mobile 风格：阅读态干净，目录可搜索，编辑态全屏，状态和诊断降级到抽屉。</textarea></div><div class="preview" id="previewPane"></div><div class="field"><label><span>提交信息</span><span>必填</span></label><input id="commitMsg" value="Update wiki Home page" oninput="markDirty()"></div></div><div class="editActions"><button class="save" onclick="saveDraft()">保存草稿</button><button onclick="simulateConflict()">模拟冲突</button><button class="commit2" onclick="commitEdit()">提交更改</button></div></aside><div class="drawer" id="drawer" onclick="closeDrawer(event)"><div class="sheet"><div class="grab"></div><div id="drawerBody"></div></div></div><div class="toast" id="toast"></div></section></main></div>
<script>
const pages=[{t:'Home',p:'Home.md',d:'Wiki 首页、项目导航和维护说明。',m:'2 小时前 · 1.8 KB'},{t:'安装与构建',p:'Build.md',d:'Android SDK、Gradle Wrapper、签名配置。',m:'昨天 · 4.2 KB'},{t:'GitHub API 策略',p:'Api-Policy.md',d:'REST、分页、限流和 wiki.git 回退策略。',m:'3 天前 · 6.7 KB'},{t:'发布检查清单',p:'Release.md',d:'版本号、签名、APK 输出和上传前检查。',m:'1 周前 · 3.1 KB'}];
let current='read', dirty=true, mode='edit';
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setView(b.dataset.view));
function setView(v){current=v;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===v));syncHeader(v);render()}
function syncHeader(v){if(v==='read'||v==='pages'){badge.className='stateBadge ok';badge.innerHTML='<i class="dot"></i>已同步';statPages.textContent='4';statHealth.textContent='良好';desc.textContent='项目知识库、操作手册与发布说明。阅读页保持干净，编辑页全屏承载复杂动作。'}else if(v==='status'){badge.className='stateBadge warn';badge.innerHTML='<i class="dot"></i>部分可用';statPages.textContent='0';statHealth.textContent='部分';desc.textContent='Wiki 已启用，但页面索引可通过刷新或 wiki.git 补全。'}else if(v==='empty'){badge.className='stateBadge warn';badge.innerHTML='<i class="dot"></i>暂无页面';statPages.textContent='0';statHealth.textContent='空';desc.textContent='空态不是错误，应给出创建 Home 页面和外部初始化入口。'}else{badge.className='stateBadge bad';badge.innerHTML='<i class="dot"></i>获取失败';statPages.textContent='—';statHealth.textContent='异常';desc.textContent='网络、权限或 API 异常时，保留重试、诊断和外部打开入口。'}}
function render(){if(current==='read')view.innerHTML=`<article class='panel'><div class='panelHead'><h2>Home.md</h2><span>最后更新：2 小时前</span></div><div class='readme'><h1>Home</h1><p>欢迎来到 <b>SunsetGitHub Wiki</b>。这里集中放置项目说明、构建流程、API 策略与发布检查清单。</p><h2>快速入口</h2><ul><li>安装与构建</li><li>GitHub API 策略</li><li>发布检查清单</li></ul><h2>设计目标</h2><p>阅读态只展示内容；编辑、诊断、冲突处理进入独立层级，避免主页面信息过载。</p></div></article>`;else if(current==='pages')view.innerHTML=`<article class='panel'><div class='panelHead'><h2>页面目录</h2><span>4 个页面</span></div><input class='search' placeholder='搜索 Wiki 页面' oninput='filterPages(this.value)'><div id='pageList'>${pageList(pages)}</div></article>`;else if(current==='status')view.innerHTML=`<article class='panel'><div class='panelHead'><h2>同步状态</h2><span>可恢复</span></div><div class='timeline'><div class='step done'><i>✓</i><div><b>REST 状态</b><span>已确认 has_wiki = true</span></div></div><div class='step active'><i>•</i><div><b>页面索引</b><span>unexpected end of stream，允许重试</span></div></div><div class='step edit'><i>✎</i><div><b>wiki.git 补全</b><span>后台同步后恢复完整目录与编辑能力</span></div></div></div></article>`;else if(current==='empty')view.innerHTML=`<article class='panel'><div class='empty'><div class='emptyIcon'>📄</div><b>还没有 Wiki 页面</b><p>创建 Home 页面后，这里会展示页面目录和最近更新时间。</p></div><div class='sheetActions' style='padding:0 14px 14px'><button class='dark' onclick='openEditor()'>创建 Home</button><button onclick='openDrawer("github")'>GitHub 初始化</button></div></article>`;else view.innerHTML=`<article class='panel'><div class='empty'><div class='emptyIcon'>⚠</div><b>读取失败</b><p>请检查网络、登录状态或仓库权限。可以重试或复制诊断。</p></div><div class='sheetActions' style='padding:0 14px 14px'><button class='dark' onclick='refresh()'>重试</button><button onclick='openDrawer("diag")'>诊断</button></div></article>`}
function pageList(list){return list.map((p,i)=>`<div class='fileItem' onclick='openPage(${i})'><div class='fileIcon'>W</div><div class='itemMain'><b>${p.t}</b><span>${p.p} · ${p.m}<br>${p.d}</span></div><div class='chev'>›</div></div>`).join('')}
function filterPages(q){q=q.toLowerCase();pageListEl=document.getElementById('pageList');pageListEl.innerHTML=pageList(pages.filter(p=>(p.t+p.p+p.d).toLowerCase().includes(q)))}
function openPage(i){const p=pages[i];drawerBody.innerHTML=`<h3>${p.t}</h3><p>${p.p} · ${p.m}</p><p>${p.d}</p><div class='sheetActions'><button class='dark' onclick='hideDrawer();openEditor()'>编辑此页</button><button onclick='hideDrawer()'>关闭</button></div>`;drawer.classList.add('show')}
function openEditor(){editorView.classList.add('show');setMode('edit');updateCounts();toast('进入编辑态')}
function tryCloseEditor(){if(dirty){openDrawer('leave');return}editorView.classList.remove('show')}
function setMode(m){mode=m;modeEdit.classList.toggle('active',m==='edit');modePreview.classList.toggle('active',m==='preview');editPane.style.display=m==='edit'?'block':'none';previewPane.style.display=m==='preview'?'block':'none';if(m==='preview')renderPreview()}
function renderPreview(){let html=editor.value.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/^# (.*)$/gm,'<h1>$1</h1>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/^- (.*)$/gm,'<li>$1</li>').replace(/(<li>.*<\/li>)/gs,'<ul>$1</ul>').replace(/\n\n/g,'</p><p>').replace(/^(?!<h|<ul|<p)(.+)$/gm,'<p>$1</p>');previewPane.innerHTML=html}
function insertMd(s){const e=editor,a=e.selectionStart,b=e.selectionEnd;e.value=e.value.slice(0,a)+s+e.value.slice(b);e.focus();e.selectionStart=e.selectionEnd=a+s.length;markDirty();toast('已插入 Markdown')}
function markDirty(){dirty=true;dirtyText.textContent='有未保存更改';notice.className='notice';notice.textContent='正在编辑本地草稿。提交前会校验远端 SHA，避免覆盖他人更新。';updateCounts();if(mode==='preview')renderPreview()}
function updateCounts(){titleCount.textContent=editTitle.value.length+' 字';wordCount.textContent=editor.value.replace(/\s/g,'').length+' 字'}
function saveDraft(){dirty=false;dirtyText.textContent='草稿已保存';notice.className='notice ok';notice.textContent='草稿已保存到本地。提交前仍会重新校验远端版本。';toast('草稿已保存')}
function commitEdit(){if(!commitMsg.value.trim()){toast('请填写提交信息');return}toast('正在提交');setTimeout(()=>{dirty=false;dirtyText.textContent='已提交';notice.className='notice ok';notice.textContent='提交成功。已刷新远端 SHA、页面时间和本地缓存。';toast('Wiki 已提交')},820)}
function simulateConflict(){dirty=true;dirtyText.textContent='存在远端冲突';notice.className='notice bad';notice.textContent='检测到远端 Home.md 已更新。请查看差异后选择覆盖远端或重新载入。';toast('已模拟冲突')}
function refresh(){setView('status');view.innerHTML=`<article class='panel'><div class='panelHead'><h2>正在刷新</h2><span>LOADING</span></div><div style='padding:14px'><div class='skeleton' style='width:92%'></div><div class='skeleton' style='width:74%'></div><div class='skeleton' style='width:84%'></div></div></article>`;toast('正在刷新');setTimeout(()=>{setView('read');toast('已同步')},850)}
function openDrawer(type){if(type==='diag')drawerBody.innerHTML=`<h3>诊断信息</h3><div class='diag'>view=${current}\nhasWiki=true\nindex=${current==='read'||current==='pages'?'ready':'partial'}\neditorDirty=${dirty}\nstrategy=github mobile read mode + full-screen editor + sha check</div><div class='sheetActions'><button class='dark' onclick='toast("诊断已复制")'>复制</button><button onclick='hideDrawer()'>关闭</button></div>`;else if(type==='github')drawerBody.innerHTML=`<h3>在 GitHub 打开</h3><p>适合未启用、权限不足或移动端 API 异常时作为兜底入口。</p><div class='sheetActions'><button class='dark' onclick='toast("打开 GitHub Wiki")'>打开</button><button onclick='hideDrawer()'>取消</button></div>`;else drawerBody.innerHTML=`<h3>有未保存更改</h3><p>离开编辑器前，建议保存草稿或提交更改。</p><div class='sheetActions'><button class='dark' onclick='saveDraft();editorView.classList.remove("show");hideDrawer()'>保存并离开</button><button onclick='dirty=false;editorView.classList.remove("show");hideDrawer()'>放弃</button></div>`;drawer.classList.add('show')}
function closeDrawer(e){if(e.target.id==='drawer')hideDrawer()}function hideDrawer(){drawer.classList.remove('show')}function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__t);window.__t=setTimeout(()=>t.classList.remove('show'),1450)}
render();
</script>
</body>
</html>
