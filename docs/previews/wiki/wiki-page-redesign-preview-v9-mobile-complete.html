:var(--purple);font-weight:900}.historyItem b{font-size:14px}.historyItem span{display:block;color:var(--muted);font-size:12px;margin-top:3px}.stateGrid{display:grid;grid-template-columns:1fr;gap:10px;padding:14px}.stateBox{border:1px solid var(--soft);border-radius:14px;padding:13px;background:#fff}.stateBox b{display:block;font-size:18px;margin-bottom:4px}.stateBox span{font-size:13px;color:var(--muted);line-height:1.42}.timeline{padding:14px}.step{display:grid;grid-template-columns:24px 1fr;gap:10px;position:relative;padding-bottom:14px}.step:not(:last-child)::after{content:"";position:absolute;left:11px;top:26px;bottom:0;width:2px;background:var(--soft)}.step i{width:24px;height:24px;border-radius:50%;background:var(--sub);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:900;font-size:12px;z-index:1}.step.done i{background:var(--green)}.step.active i{background:#bf8700}.step.fail i{background:var(--red)}.step.edit i{background:var(--purple)}.step b{font-size:14px}.step span{display:block;color:var(--muted);font-size:12px;line-height:1.38;margin-top:3px}.empty{padding:34px 18px;text-align:center}.emptyIcon{width:62px;height:62px;border-radius:24px;background:#f6f8fa;border:1px solid var(--soft);display:grid;place-items:center;margin:0 auto 12px;font-size:28px}.empty h2{font-size:19px;margin:0 0 7px}.empty p{margin:0 auto 15px;max-width:320px;color:var(--muted);font-size:14px;line-height:1.45}.bottomNav{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(255,255,255,.94);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:24px;padding:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;box-shadow:0 18px 48px rgba(31,35,40,.18);z-index:24}.bottomNav button{height:48px;border-radius:16px;background:#f6f8fa;color:var(--muted);font-size:11px;font-weight:850;display:grid;place-items:center}.bottomNav button.active{background:var(--dark);color:#fff}.fab{position:absolute;right:22px;bottom:84px;width:58px; <div class="stage"><main class="phone"><div class="status"><span>10:53</span><span>◥ 5G 100%</span></div><section class="app"><header class="top"><button class="back" onclick="toast('返回仓库详情')">‹</button><div class="title"><b>SunsetGitHub Wiki</b><span id="topSub">阅读 · Home.md</span></div><button class="iconBtn" onclick="openSheet('diag')">⌘</button></header><div class="content"><section class="hero"><div class="repoLine"><div class="repo"><div class="owner">SunsetREN / SunsetGitHub</div><h1>Wiki</h1><p class="desc" id="desc">手机端保留 GitHub Wiki 完整能力：读、管、改、查、恢复。</p></div><span class="badge ok" id="badge"><i class="dot"></i>已同步</span></div><div class="quick"><button onclick="setView('read')"><b id="statPages">5</b><span>页面</span></button><button onclick="setView('status')"><b id="statHealth">良好</b><span>状态</span></button><button onclick="openSheet('permissions')"><b>Write</b><span>权限</span></button><button onclick="openEditor('edit')"><b>编辑</b><span>Home.md</span></button></div></section><div class="segmentWrap"><div class="segment"><button class="active" data-view="read">阅读</button><button data-view="pages">页面</button><button data-view="history">历史</button><button data-view="status">状态</button><button data-view="offline">离线</button><button data-view="empty">空态</button><button data-view="error">错误</button></div></div><section id="view"></section></div><button class="fab" onclick="openEditor('new')">＋</button><nav class="bottomNav"><button class="active" data-view="read">阅读</button><button data-view="pages">页面</button><button data-view="history">历史</button><button onclick="openSheet('more')">更多</button></nav><section class="editor" id="editorView"><header class="editorTop"><button class="back" onclick="tryCloseEditor()">‹</button><div class="title"><b id="editorTitle">编辑 Home.md</b><span id="dirtyText">有未保存更改</span></div><button class="btn primary" onclick="openSheet('commit')">提交</button></header><div class="editorBody"><div class="notice" id="editorNotice">本地草稿编辑中，提交前会 ## 手机端完整能力

- 页面管理与搜索

function setView(v){current=v;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));syncHeader(v);render()}function syncHeader(v){topSub.textContent=({read:'阅读 · Home.md',pages:'页面管理',history:'历史记录',status:'状态恢复',offline:'离线缓存',empty:'空态',error:'错误态'}[v]||'Wiki');if(v==='read'||v==='pages'||v==='history'){badge.className='badge ok';badge.innerHTML='<i class="dot"></i>已同步';statPages.textContent='5';statHealth.textContent='良好';desc.textContent='手机端保留 GitHub Wiki 完整能力：读、管、改、查、恢复。'}else if(v==='status'||v==='offline'){badge.className='badge warn';badge.innerHTML='<i class="dot"></i>可恢复';statPages.textContent=v==='offline'?'3':'0';statHealth.textContent=v==='offline'?'缓存':'部分';desc.textContent='网络或索引不完整时，提供缓存、重试和 wiki.git 兜底。'}else if(v==='empty'){badge.className='badge warn';badge.innerHTML='<i class="dot"></i>暂无页面';statPages.textContent='0';statHealth.textContent='空';desc.textContent='空态不是错误，应引导创建 Home 页面。'}else{badge.className='badge bad';badge.innerHTML='<i class="dot"></i>获取失败';statPages.textContent='—';statHealth.textContent='异常';desc.textContent='网络、权限或 API 异常时保留重试和诊断。'}}
function render(){if(current==='read')view.innerHTML=`<article class='card'><div class='cardHead'><div><h2>Home.md</h2><span>最后更新：2 小时前</span></div><span class='badge ok'><i class='dot'></i>Synced</span></div><div class='metaStrip'><span class='meta'>Author: Linda</span><span class='meta'>SHA a83f1c2</span><span class='meta'>Cached</span><span class='meta'>Writable</span></div><div class='readme'><h1>Home</h1><p>v9 补全了更接近真实应用的细节：权限、缓存、提交确认、Diff、重命名、删除、目录锚点和诊断。</p><h2>手机端入口</h2><ul><li>阅读：内容与关键元数据</li><li>页面：搜索、打开、新建、重命名、删除</li><li>历史：提交记录与版本对比</li><li>更多：目录、诊断、权限、GitHub 外部打开</li></ul><h2>编辑安全</h2><p>所有远端写入都经过提交确认、commit message、SHA 检查和冲突提示。</p></div></article>`;else if(current==='pages')view.innerHTML=`<article class='card'><div class='cardHead'><div><h2>页面</h2><span>搜索、打开、新建、重命名、删除</span></div><button class='btn primary' onclick='openEditor("new")'>新建</button></div><input class='search' placeholder='搜索 Wiki 页面' oninput='filterPages(this.value)'><div id='pageList'>${pageRows(pages)}</div></article>`;else if(current==='history')view.innerHTML=`<article class='card'><div class='cardHead'><div><h2>历史记录</h2><span>Home.md revision history</span></div><button class='btn' onclick='openSheet("compare")'>对比</button></div>${history.map(h=>`<div class='historyItem'><div class='commitDot'>↻</div><div><b>${h[1]}</b><span><code>${h[0]}</code> · ${h[2]} · ${h[3]}</span></div></div>`).join('')}</article>`;else if(current==='status')view.innerHTML=`<article class='card'><div class='cardHead'><div><h2>状态恢复</h2><span>REST / Index / wiki.git</span></div><button class='btn blue' onclick='refresh()'>刷新</button></div><div class='stateGrid'><div class='stateBox'><b>REST</b><span>has_wiki=true，仓库可见，Token 可用。</span></div><div class='stateBox'><b>Index</b><span>索引部分失败，但可手动重试。</span></div><div class='stateBox'><b>wiki.git</b><span>用于恢复完整页面列表和历史。</span></div></div><div class='timeline'><div class='step done'><i>✓</i><div><b>仓库状态</b><span>Wiki 已启用。</span></div></div><div class='step active'><i>•</i><div><b>页面索引</b><span>unexpected end of stream，保留恢复入口。</span></div></div><div class='step edit'><i>✎</i><div><b>Fallback</b><span>拉取 wiki.git 完成补全。</span></div></div></div></article>`;else if(current==='offline')view.innerHTML=`<article class='card'><div class='cardHead'><div><h2>离线缓存</h2><span>网络异常时可继续阅读最近页面</span></div><span class='badge warn'><i class='dot'></i>Cached</span></div><div class='notice warn'>当前显示缓存快照。编辑和提交会在网络恢复后重新校验远端 SHA。</div>${pageRows(pages.slice(0,3))}</article>`;else if(current==='empty')view.innerHTML=`<article class='card'><div class='empty'><div class='emptyIcon'>▣</div><h2>还没有 Wiki 页面</h2><p>创建 Home 页面后，这里会显示目录、历史和编辑入口。</p><button class='btn primary' onclick='openEditor("new")'>创建 Home</button> <button class='btn' onclick='openSheet("github")'>GitHub 初始化</button></div></article>`;else view.innerHTML=`<article class='card'><div class='empty'><div class='emptyIcon'>⚠</div><h2>无法读取 Wiki</h2><p>请检查网络、登录状态或仓库权限。</p><button class='btn blue' onclick='refresh()'>重试</button> <button class='btn' onclick='openSheet("diag")'>诊断</button></div></article>`}
function pageRows(list){return list.map((p,i)=>`<div class='pageRow' onclick='openPage(${i})'><div class='fileIcon'>W</div><div class='pageMeta'><b>${p.t}</b><span>${p.p} · ${p.m}<br>${p.d}</span></div><div class='chev'>›</div></div>`).join('')}function filterPages(q){q=q.toLowerCase();pageList.innerHTML=pageRows(pages.filter(p=>(p.t+p.p+p.d).toLowerCase().includes(q)))}function openPage(i){const p=pages[i];sheetBody.innerHTML=`<h3>${p.t}</h3><p>${p.p} · ${p.m}</p><p>${p.d}</p><div class='sheetActions'><button class='btn blue' onclick='hideSheet();setView("read")'>打开</button><button class='btn' onclick='hideSheet();openEditor("edit")'>编辑</button><button class='btn' onclick='hideSheet();openSheet("rename")'>重命名</button><button class='btn danger' onclick='hideSheet();openSheet("delete")'>删除</button></div>`;sheetMask.classList.add('show')}
function openEditor(type){editorView.classList.add('show');editorTitle.textContent=type==='new'?'新建 Wiki 页面':'编辑 Home.md';dirty=true;updateDirty();setMode('edit');renderPreview();toast(type==='new'?'进入新建页面':'进入编辑器')}function tryCloseEditor(){if(dirty){openSheet('leave');return}editorView.classList.remove('show')}function closeEditor(force=false){if(force)dirty=false;editorView.classList.remove('show')}function setMode(m){mode=m;modeEdit.classList.toggle('active',m==='edit');modePreview.classList.toggle('active',m==='preview');modeDiff.classList.toggle('active',m==='diff');editPane.style.display=m==='edit'?'block':'none';previewPane.style.display=m==='preview'?'block':'none';diffPane.style.display=m==='diff'?'block':'none';if(m==='preview')renderPreview()}function markDirty(){dirty=true;updateDirty();renderPreview()}function updateDirty(){dirtyText.textContent=dirty?'有未保存更改':'草稿已保存';titleCount.textContent=editTitle.value.length+' 字';wordCount.textContent=md.value.replace(/\s/g,'').length+' 字'}function insertMd(s){const e=md,a=e.selectionStart,b=e.selectionEnd;e.value=e.value.slice(0,a)+s+e.value.slice(b);e.focus();e.selectionStart=e.selectionEnd=a+s.length;markDirty()}function renderPreview(){let html=md.value.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/^# (.*)$/gm,'<h1>$1</h1>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/^- (.*)$/gm,'<li>$1</li>').replace(/(<li>.*<\/li>)/gs,'<ul>$1</ul>').replace(/\n\n/g,'</p><p>').replace(/^(?!<h|<ul|<p)(.+)$/gm,'<p>$1</p>');previewPane.innerHTML=html}function saveDraft(){dirty=false;editorNotice.className='notice ok';editorNotice.textContent='草稿已保存到本地，提交前仍会检查远端 SHA。';updateDirty();toast('草稿已保存')}function simulateConflict(){dirty=true;editorNotice.className='notice bad';editorNotice.textContent='检测到远端页面已更新，请对比差异后再提交。';setMode('diff');updateDirty();toast('已模拟冲突')}function doCommit(){if(!commitMsg.value.trim()){toast('请填写提交信息');return}hideSheet();toast('正在提交');setTimeout(()=>{dirty=false;editorNotice.className='notice ok';editorNotice.textContent='提交成功，已刷新页面时间和本地缓存。';updateDirty();toast('Wiki 已提交')},800)}
function openSheet(type){if(type==='more')sheetBody.innerHTML=`<h3>更多功能</h3><p>桌面版次级能力统一收纳到这里。</p><div class='sheetActions'><button class='btn' onclick='hideSheet();openSheet("toc")'>目录</button><button class='btn' onclick='hideSheet();openSheet("diag")'>诊断</button><button class='btn' onclick='hideSheet();openSheet("permissions")'>权限</button><button class='btn' onclick='hideSheet();openSheet("github")'>GitHub</button></div>`;else if(type==='commit')sheetBody.innerHTML=`<h3>提交更改</h3><p>提交前将校验远端 SHA，若远端已变化会进入冲突处理。</p><div class='notice'><b>Commit message</b><br>${commitMsg.value||'Update wiki page'}</div><div class='sheetActions'><button class='btn primary' onclick='doCommit()'>确认提交</button><button class='btn' onclick='hideSheet()'>继续编辑</button></div>`;else if(type==='permissions')sheetBody.innerHTML=`<h3>权限</h3><p>当前账号具备 Wiki 写权限。若无写权限，编辑入口应降级为只读，并展示 GitHub 外部打开。</p><div class='stateGrid'><div class='stateBox'><b>Read</b><span>允许</span></div><div class='stateBox'><b>Write</b><span>允许</span></div><div class='stateBox'><b>Delete</b><span>需要确认</span></div></div>`;else if(type==='diag')sheetBody.innerHTML=`<h3>诊断信息</h3><div class='diag'>view=${current}\nhasWiki=true\nindex=${current==='read'||current==='pages'?'ready':'partial'}\npermission=write\ncache=3 pages\neditorDirty=${dirty}\nlayout=v9 mobile complete</div><div class='sheetActions'><button class='btn blue' onclick='toast("诊断已复制")'>复制</button><button class='btn' onclick='hideSheet()'>关闭</button></div>`;else if(type==='toc')sheetBody.innerHTML=`<h3>页面目录</h3><div class='pageList'><div class='pageRow'><div class='fileIcon'>#</div><div class='pageMeta'><b>Home</b><span>顶部</span></div></div><div class='pageRow'><div class='fileIcon'>#</div><div class='pageMeta'><b>手机端入口</b><span>Section</span></div></div><div class='pageRow'><div class='fileIcon'>#</div><div class='pageMeta'><b>编辑安全</b><span>Section</span></div></div></div>`;else if(type==='compare')sheetBody.innerHTML=`<h3>版本对比</h3><p><b>a83f1c2</b> Update wiki Home page</p><p style='color:var(--green)'>+ Added commit confirmation and offline cache</p><p style='color:var(--red)'>- Removed desktop-only split navigation</p><div class='sheetActions'><button class='btn blue' onclick='toast("已选择版本")'>恢复此版本</button><button class='btn' onclick='hideSheet()'>关闭</button></div>`;else if(type==='rename')sheetBody.innerHTML=`<h3>重命名页面</h3><p>重命名会创建新路径并删除旧路径，提交前需要确认。</p><input class='search' value='Home' style='width:100%;margin:8px 0'><div class='sheetActions'><button class='btn primary' onclick='toast("页面已重命名")'>确认</button><button class='btn' onclick='hideSheet()'>取消</button></div>`;else if(type==='delete')sheetBody.innerHTML=`<h3>删除页面</h3><p>删除 Wiki 页面需要写权限，并会生成一次提交记录。</p><div class='sheetActions'><button class='btn danger' onclick='toast("页面已删除")'>确认删除</button><button class='btn' onclick='hideSheet()'>取消</button></div>`;else if(type==='github')sheetBody.innerHTML=`<h3>在 GitHub 打开</h3><p>用于未启用、权限不足或 API 异常时的兜底入口。</p><div class='sheetActions'><button class='btn blue' onclick='toast("打开 GitHub Wiki")'>打开</button><button class='btn' onclick='hideSheet()'>取消</button></div>`;else sheetBody.innerHTML=`<h3>有未保存更改</h3><p>离开编辑器前，建议保存草稿或提交。</p><div class='sheetActions'><button class='btn blue' onclick='saveDraft();closeEditor(true);hideSheet()'>保存并离开</button><button class='btn danger' onclick='closeEditor(true);hideSheet()'>放弃</button></div>`;sheetMask.classList.add('show')}function closeSheet(e){if(e.target.id==='sheetMask')hideSheet()}function hideSheet(){sheetMask.classList.remove('show')}function refresh(){setView('status');toast('正在刷新');setTimeout(()=>{setView('read');toast('已同步')},850)}function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__t);window.__t=setTimeout(()=>t.classList.remove('show'),1450)}
render();renderPreview();updateDirty();
</script>
</body>
</html>
