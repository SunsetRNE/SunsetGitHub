<div class="stage"><main class="browser"><header class="topbar"><div class="mark">GH</div><input class="globalSearch" placeholder="Search or jump to..."><span class="topLink">Pull requests</span><span class="topLink">Issues</span><span class="topLink">Codespaces</span><span class="topLink">Marketplace</span><button class="topIcon">＋</button><button class="topIcon">◎</button></header><section class="repoHero"><div class="repoLine"><div class="repoName"><span class="book">▣</span><h1><span>SunsetREN /</span> SunsetGitHub</h1><span class="visibility">Public</span></div><div class="repoActions"><button class="ghBtn">♡ Sponsor</button><button class="ghBtn">☆ Star <b>128</b></button><button class="ghBtn">⑂ Fork <b>21</b></button><button class="ghBtn primary" onclick="openEditor('new')">New wiki page</button></div></div><nav class="repoTabs"><button class="repoTab">Code</button><button class="repoTab">Issues <span>12</span></button><button class="repoTab">Pull requests <span>3</span></button><button class="repoTab">Actions</button><button class="repoTab active">Wiki</button><button class="repoTab">Security</button><button class="repoTab">Insights</button></nav></section><section class="layout"><aside class="sidebar"><div class="sideSection"><div class="sideHead"><h2>Wiki pages</h2><button onclick="openEditor('new')">New page</button></div><input class="sideSearch" placeholder="Find a page" oninput="filterSidePages(this.value)"><div class="pageList" id="sidePages"></div></div><div class="sideSection"><div class="sideHead"><h2>Clone this wiki locally</h2></div><div class="statusCard"><div class="statusLine"><span class="pill ok"><i class="dot"></i>Enabled</span><span>4 pages</span></div><input class="sideSearch" value="https://github.com/SunsetREN/SunsetGitHub.wiki.git" readonly><button class="ghBtn" style="width:100%;justify-content:center" onclick="toast('Wiki Git URL 已复制')">Copy clone URL</button></div></div><div class="sideSection"><div class="sideHead"><h2>Feature state <script>
const pages=[{title:'Home',path:'Home.md',updated:'2 hours ago',author:'Linda Smith',size:'1.8 KB',desc:'Project overview, navigation, and maintenance notes.'},{title:'安装与构建',path:'Build.md',updated:'Yesterday',author:'REN',size:'4.2 KB',desc:'Android SDK, Gradle Wrapper, signing, and local configuration.'},{title:'GitHub API 策略',path:'Api-Policy.md',updated:'3 days ago',author:'Sunset',size:'6.7 KB',desc:'REST API, pagination, rate limits, wiki.git fallback, and errors.'},{title:'发布检查清单',path:'Release.md',updated:'1 week ago',author:'REN',size:'3.1 KB',desc:'Versioning, signing, APK output, and pre-upload checks.'},{title:'故障排查',path:'Troubleshooting.md',updated:'2 weeks ago',author:'Linda Smith',size:'2.6 KB',desc:'Common build, auth, and network troubleshooting steps.'}];

function init(){renderSidePages(pages);render();renderPreview();updateCounts()}function renderSidePages(list){sidePages.innerHTML=list.map((p,i)=>`<div class='pageRow ${i===0?'active':''}' onclick='selectPage(${i})'><div class='pageIcon'>▣</div><div class='pageMeta'><b>${p.title}</b><span>${p.updated} · ${p.size}</span></div></div>`).join('')}function filterSidePages(q){q=q.toLowerCase();renderSidePages(pages.filter(p=>(p.title+p.path+p.desc).toLowerCase().includes(q)))}function selectPage(i){pageCrumb.textContent=pages[i].title;setView('read');toast('打开 '+pages[i].title)}
function setView(v){view=v;render()}function setNotice(kind,title,msg){notice.innerHTML=`<div class='notice ${kind}'><div class='noticeIcon'>${kind==='bad'?'⚠':kind==='warn'?'●':'✓'}</div><div class='noticeMain'><b>${title}</b><p>${msg}</p></div></div>`}function clearNotice(){notice.innerHTML=''}
function render(){if(view==='read'){clearNotice();workspace.innerHTML=`<div class='wikiHead'><div class='wikiHeadTitle'><h2>Home</h2><span>edited by Linda Smith 2 hours ago · 1 revision ahead of local draft</span></div><span class='pill ok'><i class='dot'></i>Synced</span></div><article class='readme'><h1>Home</h1><p>Welcome to the <b>SunsetGitHub Wiki</b>. This page is designed like GitHub Web Wiki: complete reader, directory, history, diagnostics, clone URL, and full editing flow.</p><h2>Quick links</h2><ul><li>Installation and build</li><li>GitHub API policy</li><li>Release checklist</li><li>Troubleshooting</li></ul><h2>Feature model</h2><p>The reader stays clean. Editing, conflict handling, diagnostics, page creation, and external fallback live in dedicated layers.</p><pre><code>git clone https://github.com/SunsetREN/SunsetGitHub.wiki.git</code></pre></article>`}else if(view==='pages'){clearNotice();workspace.innerHTML=`<div class='wikiHead'><div class='wikiHeadTitle'><h2>Pages</h2><span>All wiki pages, searchable and editable</span></div><button class='ghBtn primary' onclick='openEditor("new")'>New page</button></div><input class='sideSearch' style='margin:12px;width:calc(100% - 24px)' placeholder='Filter pages' oninput='filterTable(this.value)'><table class='table'><thead><tr><th>Page</th><th>Updated</th><th>Author</th><th>Size</th><th></th></tr></thead><tbody id='pageTable'>${pageTableRows(pages)}</tbody></table>`}else if(view==='history'){clearNotice();workspace.innerHTML=`<div class='wikiHead'><div class='wikiHeadTitle'><h2>Revision history</h2><span>Audit trail for Home.md</span></div><button class='ghBtn' onclick='openDialog("compare")'>Compare revisions</button></div><table class='table'><thead><tr><th>Commit</th><th>Message</th><th>Author</th><th>When</th></tr></thead><tbody>${history.map(h=>`<tr><td><code>${h[0]}</code></td><td>${h[1]}</td><td>${h[2]}</td><td>${h[3]}</td></tr>`).join('')}</tbody></table>`}else if(view==='status'){setNotice('warn','Wiki enabled, index partially recoverable','REST confirms has_wiki=true. Page index can be refreshed or completed through wiki.git.');workspace.innerHTML=`<div class='wikiHead'><div class='wikiHeadTitle'><h2>Status and recovery</h2><span>Operational state for wiki integration</span></div><button class='ghBtn blue' onclick='refresh()'>Refresh index</button></div><div class='timeline'><div class='step done'><i>✓</i><div><b>Repository REST state</b><span>has_wiki=true, repository visible, token accepted</span></div></div><div class='step active'><i>•</i><div><b>Page index probe</b><span>unexpected end of stream; fallback remains available</span></div></div><div class='step edit'><i>✎</i><div><b>wiki.git fallback</b><span>Clone or fetch wiki.git to recover complete page list and history</span></div></div></div>`}else if(view==='empty'){setNotice('warn','Wiki is enabled but empty','This is not an error. Guide users to create Home.md or initialize on GitHub.');workspace.innerHTML=`<div class='emptyBox'><div class='emptyIcon'>▣</div><h2>No wiki pages yet</h2><p>Create a Home page in the app, or open GitHub Wiki to initialize the repository wiki.</p><button class='ghBtn primary' onclick='openEditor("new")'>Create Home page</button> <button class='ghBtn' onclick='openDialog("github")'>Open GitHub Wiki</button></div>`}else{setNotice('bad','Wiki could not be loaded','Network, permissions, API limits, or wiki.git access failed. Keep retry and diagnostics available.');workspace.innerHTML=`<div class='emptyBox'><div class='emptyIcon'>⚠</div><h2>Unable to load wiki</h2><p>Check network, login state, repository permissions, or copy diagnostics for debugging.</p><button class='ghBtn blue' onclick='refresh()'>Retry</button> <button class='ghBtn' onclick='openDialog("diag")'>Diagnostics</button></div>`}}
function pageTableRows(list){return list.map((p,i)=>`<tr><td><b>${p.title}</b><br><span style='color:var(--muted);font-size:12px'>${p.path} · ${p.desc}</span></td><td>${p.updated}</td><td>${p.author}</td><td>${p.size}</td><td class='actionsCell'><button class='ghBtn' onclick='selectPage(${i})'>Open</button> <button class='ghBtn' onclick='openEditor("edit")'>Edit</button></td></tr>`).join('')}function filterTable(q){q=q.toLowerCase();pageTable.innerHTML=pageTableRows(pages.filter(p=>(p.title+p.path+p.desc+p.author).toLowerCase().includes(q)))}
function openEditor(mode){editingMode=mode;editorPage.classList.add('show');editorTitle.textContent=mode==='new'?'Creating new wiki page':'Editing Home';editorSub.textContent='Unsaved changes';if(mode==='new'){editTitle.value='Home';commitMsg.value='Create wiki Home page'}markDirty();renderPreview();toast(mode==='new'?'New page flow':'Editor opened')}function tryCloseEditor(){if(dirty){openDialog('leave');return}editorPage.classList.remove('show')}function closeEditor(force=false){if(force){dirty=false}editorPage.classList.remove('show')}function markDirty(){dirty=true;editorSub.textContent='Unsaved changes';editorNotice.className='editorNotice';editorNotice.textContent='Editing local draft. Commit checks remote SHA before write.';updateCounts();renderPreview()}function updateCounts(){titleCount.textContent=editTitle.value.length+' chars';wordCount.textContent=editor.value.replace(/\s/g,'').length+' chars'}function insertMd(s){const e=editor,a=e.selectionStart,b=e.selectionEnd;e.value=e.value.slice(0,a)+s+e.value.slice(b);e.focus();e.selectionStart=e.selectionEnd=a+s.length;markDirty()}function renderPreview(){let html=editor.value.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/^# (.*)$/gm,'<h1>$1<\/h1>').replace(/^## (.*)$/gm,'<h2>$1<\/h2>').replace(/`([^`]+)`/g,'<code>$1<\/code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1<\/b>').replace(/^- (.*)$/gm,'<li>$1<\/li>').replace(/(<li>.*<\/li>)/gs,'<ul>$1<\/ul>').replace(/```bash\n([\s\S]*?)```/g,'<pre><code>$1<\/code><\/pre>').replace(/\n\n/g,'<\/p><p>').replace(/^(?!<h|<ul|<p|<pre)(.+)$/gm,'<p>$1<\/p>');livePreview.innerHTML=html}function saveDraft(){dirty=false;editorSub.textContent='Draft saved';editorNotice.className='editorNotice ok';editorNotice.textContent='Draft saved locally. Remote SHA will still be checked before commit.';toast('Draft saved')}function simulateConflict(){dirty=true;editorSub.textContent='Remote conflict';editorNotice.className='editorNotice bad';editorNotice.textContent='Remote page changed since this draft was loaded. Compare revisions before overwriting.';toast('Conflict simulated')}function commitEdit(){if(!commitMsg.value.trim()){toast('Commit message required');return}toast('Committing wiki page');setTimeout(()=>{dirty=false;editorSub.textContent='Committed';editorNotice.className='editorNotice ok';editorNotice.textContent='Commit successful. Remote SHA, updated time, and local cache refreshed.';setView('read');toast('Wiki committed')},850)}
function openDialog(type){drawer.classList.add('show');if(type==='diag'){dialogTitle.textContent='Diagnostics';dialogBody.innerHTML=`<div class='diag'>view=${view}\nhasWiki=true\nindex=${view==='read'||view==='pages'?'ready':'partial'}\neditorDirty=${dirty}\ncloneUrl=https://github.com/SunsetREN/SunsetGitHub.wiki.git\nstrategy=GitHub web wiki: reader + pages + history + split editor + SHA conflict check</div>`;dialogFoot.innerHTML=`<button class='ghBtn blue' onclick='toast("Diagnostics copied")'>Copy diagnostics</button><button class='ghBtn' onclick='closeDialog()'>Close</button>`}else if(type==='toc'){dialogTitle.textContent='Table of contents';dialogBody.innerHTML=`<div class='pageList'><div class='pageRow'><div class='pageIcon'>#</div><div class='pageMeta'><b>Home</b><span>Top of page</span></div></div><div class='pageRow'><div class='pageIcon'>#</div><div class='pageMeta'><b>Quick links</b><span>Navigation section</span></div></div><div class='pageRow'><div class='pageIcon'>#</div><div class='pageMeta'><b>Feature model</b><span>Design rationale</span></div></div></div>`;dialogFoot.innerHTML=`<button class='ghBtn' onclick='closeDialog()'>Close</button>`}else if(type==='compare'){dialogTitle.textContent='Compare revisions';dialogBody.innerHTML=`<table class='table'><tr><th>Base</th><td><code>9d21aa4</code> Add API strategy notes</td></tr><tr><th>Head</th><td><code>a83f1c2</code> Update wiki Home page</td></tr><tr><th>Diff</th><td><span style='color:var(--success)'>+ Added feature model section</span><br><span style='color:var(--danger)'>- Removed old placeholder text</span></td></tr></table>`;dialogFoot.innerHTML=`<button class='ghBtn blue' onclick='toast("Revision selected")'>Restore selected</button><button class='ghBtn' onclick='closeDialog()'>Close</button>`}else if(type==='github'){dialogTitle.textContent='Open GitHub Wiki';dialogBody.innerHTML='<p>Use this fallback when API state is incomplete, permissions are missing, or the user wants the canonical GitHub web editor.<\/p>';dialogFoot.innerHTML=`<button class='ghBtn blue' onclick='toast("Opening GitHub Wiki")'>Open GitHub</button><button class='ghBtn' onclick='closeDialog()'>Cancel</button>`}else{dialogTitle.textContent='Unsaved changes';dialogBody.innerHTML='<p>You have unsaved wiki edits. Save a draft, keep editing, or discard changes.<\/p>';dialogFoot.innerHTML=`<button class='ghBtn' onclick='saveDraft();closeEditor(true);closeDialog()'>Save draft and leave</button><button class='ghBtn danger' onclick='closeEditor(true);closeDialog()'>Discard</button><button class='ghBtn blue' onclick='closeDialog()'>Keep editing</button>`}}function closeDialog(){drawer.classList.remove('show')}function refresh(){setView('status');workspace.innerHTML=`<div class='wikiHead'><div class='wikiHeadTitle'><h2>Refreshing wiki index</h2><span>Checking REST state, page index, and wiki.git fallback</span></div><span class='pill warn'>Loading</span></div><div style='padding:18px'><div class='skeleton' style='width:92%'></div><div class='skeleton' style='width:78%'></div><div class='skeleton' style='width:84%'></div></div>`;toast('Refreshing');setTimeout(()=>{setView('read');toast('Wiki index refreshed')},900)}function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove('show'),1500)}
init();
</script>
